# Spring Boot Application Properties

# Application Info
spring.application.name=spring-batch-multi-format
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/batch_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Batch Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-database=always

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# File Monitoring
file.monitor.path=/Users/shankranarayanan/Desktop/important files
file.pattern.txt=BATCH_\\d{4}-\\d{2}-\\d{2}-\\d{2}:\\d{2}:\\d{2}\\.txt
file.pattern.csv=BATCH_\\d{4}-\\d{2}-\\d{2}-\\d{2}:\\d{2}:\\d{2}\\.csv
file.pattern.xlsx=BATCH_\\d{4}-\\d{2}-\\d{2}-\\d{2}:\\d{2}:\\d{2}\\.xlsx

# Zalando Logbook — HTTP request/response logging (see logback-spring.xml for appenders)
logbook.format.style=http
logbook.obfuscate.headers=Authorization,Cookie
logbook.write.max-body-size=1000
logbook.strategy=body-only-if-status-at-least

# Logging levels are managed in logback-spring.xml
